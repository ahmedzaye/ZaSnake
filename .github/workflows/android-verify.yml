name: Android verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Debug tests and unsigned release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The former android-actions/setup-android@v3 tried to install the
      # obsolete Android SDK 'tools' package and failed BEFORE compiling.
      # Ubuntu GitHub-hosted runners already have the Android SDK command-line
      # tools. Install only the requested modern platform/build-tools.
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:?GitHub runner Android SDK missing}"
          command -v sdkmanager
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Wrapper JAR is not committed in this repository. Do not invoke
      # ./gradlew until the verified wrapper JAR is restored.
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android and execute unit tests
        run: |
          gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug

      - name: Build unsigned v4 release AAB with R8
        run: |
          gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Verify v4 release manifest and bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("app/build/intermediates")
          manifests = list(root.glob("merged_manifests/release/**/AndroidManifest.xml"))
          manifests += list(root.glob("merged_manifest/release/**/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("Release merged manifest not found")
          manifest = ET.parse(manifests[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          perms = {
              e.get(android + "name")
              for e in manifest
              if e.tag in ("uses-permission", "uses-permission-sdk-23")
          }
          forbidden = {
              "com.android.vending.BILLING",
              "com.google.android.gms.permission.AD_ID",
              "android.permission.ACCESS_ADSERVICES_AD_ID",
              "android.permission.ACCESS_ADSERVICES_ATTRIBUTION",
              "android.permission.ACCESS_ADSERVICES_TOPICS",
          }
          present = perms & forbidden
          if present:
              raise SystemExit("Forbidden v4 release permission(s): " + str(sorted(present)))
          if manifest.get("package") != "com.zayedart.zasnake":
              raise SystemExit("Unexpected package in merged release manifest")
          bundles = list(pathlib.Path("app/build/outputs/bundle/release").glob("*.aab"))
          if not bundles:
              raise SystemExit("Release AAB was not produced")
          print("v4 release manifest passed; unsigned bundle generated")
          PY

      # For verification only: unsigned artifacts MUST NOT be uploaded to Play.
      # Signing must use the developer's existing private Play upload key.
